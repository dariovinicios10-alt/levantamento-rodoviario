name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm install

      - name: Create www folder
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Init Capacitor
        run: npx cap init "Levantamento Rodoviario" "br.com.caminhosdacelulose.levantamento" --web-dir www

      - name: Add Android platform
        run: npx cap add android

      - name: Copy web assets
        run: npx cap copy android

      - name: Fix Gradle Maven repositories
        run: |
          # Adicionar mirrors no settings.gradle para evitar 403 do Maven Central
          SETTINGS="android/settings.gradle"
          if grep -q "repositories" "$SETTINGS"; then
            sed -i '/repositories {/a\            maven { url "https://maven.google.com/" }' "$SETTINGS" || true
          fi

          # Configurar init script global do Gradle com mirrors
         mkdir -p ~/.gradle/init.d
echo 'allprojects {' > ~/.gradle/init.d/mirrors.gradle
echo '  buildscript {' >> ~/.gradle/init.d/mirrors.gradle
echo '    repositories {' >> ~/.gradle/init.d/mirrors.gradle
echo '      maven { url "https://maven.google.com/" }' >> ~/.gradle/init.d/mirrors.gradle
echo '      google()' >> ~/.gradle/init.d/mirrors.gradle
echo '      mavenCentral()' >> ~/.gradle/init.d/mirrors.gradle
echo '      maven { url "https://jitpack.io" }' >> ~/.gradle/init.d/mirrors.gradle
echo '    }' >> ~/.gradle/init.d/mirrors.gradle
echo '  }' >> ~/.gradle/init.d/mirrors.gradle
echo '  repositories {' >> ~/.gradle/init.d/mirrors.gradle
echo '    maven { url "https://maven.google.com/" }' >> ~/.gradle/init.d/mirrors.gradle
echo '    google()' >> ~/.gradle/init.d/mirrors.gradle
echo '    mavenCentral()' >> ~/.gradle/init.d/mirrors.gradle
echo '    maven { url "https://jitpack.io" }' >> ~/.gradle/init.d/mirrors.gradle
echo '  }' >> ~/.gradle/init.d/mirrors.gradle
echo '}' >> ~/.gradle/init.d/mirrors.gradle
          echo "Mirrors configurados"
          cat ~/.gradle/init.d/mirrors.gradle

          # Propriedades Gradle
          echo "org.gradle.daemon=false" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties

      - name: Add permissions to AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|<application|<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n    <application|' "$MANIFEST"
          grep "permission" "$MANIFEST"

      - name: Apply app icons
        run: |
          mkdir -p android/app/src/main/res/mipmap-mdpi
          echo "" | base64 -d > android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          mkdir -p android/app/src/main/res/mipmap-hdpi
          echo "" | base64 -d > android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          echo "" | base64 -d > android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp android/app/src/main/res/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          echo "" | base64 -d > android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          echo "" | base64 -d > android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          find android/app/src/main/res -name "*.xml" -path "*/mipmap-*" -delete 2>/dev/null || true
          echo "Icons aplicados"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: levantamento-v6
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
