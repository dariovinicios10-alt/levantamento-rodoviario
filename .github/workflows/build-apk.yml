name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm install

      - name: Create www folder
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Init Capacitor
        run: |
          npx cap init "Levantamento Rodoviario" "br.com.caminhosdacelulose.levantamento" --web-dir www || true

      - name: Add Android platform
        run: |
          npx cap add android || true

      - name: Copy web assets
        run: |
          npx cap copy android

      - name: Configure Gradle
        run: |
          echo "org.gradle.daemon=false" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties

      - name: Add Android permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          sed -i 's|<application|<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\
              <uses-permission android:name="android.permission.CAMERA" />\
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\
              <uses-feature android:name="android.hardware.location.gps" android:required="false" />\
              <application|' "$MANIFEST"

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: levantamento-rodoviario-apk
          path: android/app/build/outputs/apk/debug/*.apk
