<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autenticando...</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;background:#f2f2f2;}
.box{text-align:center;background:#fff;padding:40px 30px;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.12);max-width:340px;width:90%;}
.ico{font-size:48px;margin-bottom:16px;}
h3{color:#0e2841;font-size:18px;margin-bottom:8px;}
p{color:#5a6a7a;font-size:13px;line-height:1.6;}
.spinner{display:inline-block;width:28px;height:28px;border:3px solid #e0e0e0;border-top-color:#00b050;border-radius:50%;animation:spin 1s linear infinite;margin-top:16px;}
@keyframes spin{to{transform:rotate(360deg)}}
.erro{color:#e84040;font-size:12px;margin-top:12px;line-height:1.5;}
.ok{color:#00b050;font-size:15px;font-weight:700;margin-top:12px;}
</style>
</head>
<body>
<div class="box">
  <div class="ico" id="ico">&#9729;</div>
  <h3>Conectando ao SharePoint</h3>
  <p id="msg">Processando autenticação...</p>
  <div class="spinner" id="spin"></div>
  <p class="erro" id="err" style="display:none"></p>
  <p class="ok" id="ok" style="display:none"></p>
</div>
<script>
var CLIENT_ID = 'b06106e3-083b-4635-b3b4-525ab54197f6';
var TENANT_ID = '7876d343-00f5-4c18-9764-5133f545aec6';
var REDIRECT  = 'https://levantamento-rodoviario.pages.dev/auth.html';
var APP_URL   = 'https://levantamentoconservacao.netlify.app';

function erro(msg){
  document.getElementById('spin').style.display='none';
  document.getElementById('ico').textContent='❌';
  document.getElementById('err').style.display='block';
  document.getElementById('err').textContent=msg;
  document.getElementById('msg').textContent='Erro na autenticação.';
}

function sucesso(data){
  // Salvar token
  localStorage.setItem('ms_token', JSON.stringify({
    access_token: data.access_token,
    expires: Date.now() + ((data.expires_in||3600)*1000)
  }));
  if(data.refresh_token) localStorage.setItem('ms_refresh_token', data.refresh_token);

  document.getElementById('spin').style.display='none';
  document.getElementById('ico').textContent='✅';
  document.getElementById('ok').style.display='block';
  document.getElementById('ok').textContent='Conectado! Fechando...';
  document.getElementById('msg').textContent='Login realizado com sucesso.';

  // SEMPRE fechar esta aba/popup - nunca redirecionar para o app
  setTimeout(function(){
    // Tentar fechar popup
    window.close();
    // Se nao fechar (aba normal), redirecionar para o app
    setTimeout(function(){
      if(!window.closed){
        window.location.replace(APP_URL);
      }
    }, 500);
  }, 1000);
}

var params = new URLSearchParams(window.location.search);
var code   = params.get('code');
var errMsg = params.get('error');

if(errMsg){
  erro(params.get('error_description')||errMsg);
} else if(code){
  document.getElementById('msg').textContent='Obtendo token de acesso...';
  var verifier = localStorage.getItem('ms_code_verifier')||'';

  var body = 'client_id='+encodeURIComponent(CLIENT_ID)
    +'&grant_type=authorization_code'
    +'&code='+encodeURIComponent(code)
    +'&redirect_uri='+encodeURIComponent(REDIRECT)
    +'&scope='+encodeURIComponent('https://graph.microsoft.com/Files.ReadWrite.All https://graph.microsoft.com/Sites.ReadWrite.All https://graph.microsoft.com/User.Read offline_access');

  if(verifier) body += '&code_verifier='+encodeURIComponent(verifier);

  fetch('https://login.microsoftonline.com/'+TENANT_ID+'/oauth2/v2.0/token',{
    method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:body
  })
  .then(function(r){return r.json();})
  .then(function(d){
    if(d.access_token){ sucesso(d); }
    else { erro((d.error_description||d.error||'Token inválido')); }
  })
  .catch(function(e){ erro('Erro de rede: '+e.message); });
} else {
  erro('Nenhum código de autorização encontrado.');
}
</script>
</body>
</html>
